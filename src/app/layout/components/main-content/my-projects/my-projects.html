<section id="my-projects" class="my-projects">
  <div class="my-projects__content">
    <h2>My Projects</h2>
    <div>
      <button id="tab-daBubble" class="tab-btn active" (click)="('')">1.Da Bubble</button>
      <button id="tab-elPolloLoco" class="tab-btn" (click)="('')">2.El Pollo Loco</button>
      <button id="tab-join" class="tab-btn" (click)="('')">3.Join</button>
      <button id="tab-ongoingProject" class="tab-btn" (click)="('')">4.Ongoing Project</button>
      <div class="my-projects__content__box">
        @for (item of list; track item.name; let index = $index) {
          <div class="my-projects__content__box--left">
            <div>{{ item.name }}</div>
            <table class="my-projects__content__table">
              <tr role="link">
                <th>{{ item.about }}</th>
                <td>{{ item.aboutText }}</td>
              </tr>
              <tr>
                <th>{{ item.organise }}</th>
                <td>{{ item.organiseText }}</td>
              </tr>
              <tr>
                <th>{{ item.experience }}</th>
                <td>{{ item.experienceText }}</td>
              </tr>
            </table>
          </div>
          <div class="my-projects__content__box--right">
            <h4>Technologies</h4>

            <div>
              {{ item.technologies }}
            </div>
            <div class="my-projects__content__box--right--imgBox">
              {{ item.image }}
            </div>
            <div>
              <a href=""
                ><button>{{ item.urlTest }}</button></a
              >
              <a href="https://github.com/eliashashimi/EL-POLLO-LOCO"
                ><button>{{ item.urlGit }}</button></a
              >
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
